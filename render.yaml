# Render Blueprint — deploy the API from this repo.
# In the Render dashboard: New → Blueprint → select this repository.
#
# After the API is live, deploy the frontend on Vercel with:
#   Root Directory: frontend/assignmentHub
#   Env: VITE_API_URL=/api (or leave unset to use the same-origin proxy)
# Then set CLIENT_URL on this API service to your Vercel URL.

services:
  - type: web
    name: assignment-hub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Supabase Session Pooler URL; configure as a secret in Render.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: 10000
      - key: MAX_UPLOAD_MB
        value: 10
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        value: https://dpkmhmwemrywemqctnik.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
